<section class="py-20 bg-black">
  <div class="max-w-screen-2xl mx-auto px-margin-mobile md:px-margin-desktop">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      @for (val of values; track val.title; let i = $index) {
        <div
          appScrollReveal
          [class]="'reveal-on-scroll animation-delay-' + (i + 1) * 100"
        >
          <div
            class="glass-card h-full cursor-pointer rounded-3xl p-8 hover:border-primary/50 hover:-translate-y-2 hover:shadow-2xl hover:shadow-primary/30 transition-all duration-300"
          >
            <div
              class="w-14 h-14 rounded-2xl bg-gray-100 flex items-center justify-center text-primary mb-6"
            >
              <span
                class="material-symbols-outlined text-3xl"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >{{ val.icon }}</span
              >
            </div>
            <h3 class="font-headline-md text-xl mb-3 text-black">
              {{ val.title }}
            </h3>
            <p class="font-body-md text-black leading-relaxed">
              {{ val.description }}
            </p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
